<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Privacy Policy page</title>
</head>
<script>
    const loadComponents = (id, url) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
    }
    window.onload = () => {
        loadComponents('header', 'src/sections/header.html');
        loadComponents('privacy', 'src/sections/privacy.html');
        loadComponents('hero5', 'src/sections/hero5.html');
        loadComponents('footer', 'src/sections/footer.html');
    }
</script>
<body>
    <div id="header" class="text-green"></div>
    <div id="privacy"></div>
    <div id="hero5" class="hidden md:block lg:block"></div>
    <div id="footer" class="text-green"></div>
</body>
</html>
